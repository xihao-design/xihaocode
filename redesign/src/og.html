<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>西浩资源库 · OG 分享图模板</title>
<style>
  /* 1200×630 社交分享图。深色玻璃版 —— 在信息流里比浅色更抓眼。
     改完运行：node redesign/tools/make-og.mjs */
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    width:1200px;height:630px;overflow:hidden;position:relative;
    background:#0B0C10;color:#ECEEF2;
    font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB","Segoe UI",sans-serif;
    display:flex;flex-direction:column;justify-content:space-between;
    padding:76px 80px;
  }
  /* 柔光：只在这里用，站点正文里克制使用。紫↔珊瑚双色 */
  .glow{
    position:absolute;inset:0;pointer-events:none;
    background:
      radial-gradient(42% 54% at 14% 20%, rgba(157,123,255,.22), transparent 70%),
      radial-gradient(38% 46% at 82% 12%, rgba(255,142,106,.18), transparent 72%),
      radial-gradient(34% 42% at 62% 92%, rgba(86,196,178,.12), transparent 70%);
  }
  header,main,footer{position:relative}

  header{display:flex;align-items:center;gap:12px;font-weight:650;font-size:23px;letter-spacing:-.01em}
  .mark{display:flex;flex-direction:column;gap:3.4px;width:26px}
  .mark i{height:6.4px;border-radius:3.2px;display:block}
  .mark i:nth-child(1){width:26px;background:linear-gradient(90deg,#9D7BFF,#FF8E6A)}
  .mark i:nth-child(2){width:19px;background:rgba(236,238,242,.55)}
  .mark i:nth-child(3){width:12px;background:rgba(236,238,242,.28)}
  .tag{margin-left:6px;padding-left:13px;border-left:1px solid rgba(255,255,255,.18);
       font-size:14px;font-weight:500;letter-spacing:.12em;color:#71767F}

  main{max-width:900px}
  .eyebrow{font-size:14px;letter-spacing:.18em;text-transform:uppercase;color:#71767F;margin-bottom:20px}
  /* 48px / 900px 的余量是算出来的：13 个汉字 × ~58px ≈ 874px，
     再大一点第二行就会掉出一个「源。」孤字（改这行前先量一下宽度） */
  h1{font-size:48px;line-height:1.2;letter-spacing:-.03em;font-weight:650}
  h1 em{
    font-style:normal;
    background:linear-gradient(90deg,#B79AFF,#FF8E6A);
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;color:transparent;
  }
  p{margin-top:22px;font-size:19px;line-height:1.7;color:#A6ABB6;max-width:660px}

  footer{display:flex;align-items:flex-end;justify-content:space-between;gap:24px}
  .host{font-size:17px;color:#71767F;letter-spacing:.02em}
  .facts{display:flex;gap:10px}
  .fact{
    font-size:14.5px;color:#A6ABB6;
    border:1px solid rgba(255,255,255,.14);border-radius:999px;
    padding:6px 14px;background:rgba(255,255,255,.05);
  }
</style>
</head>
<body>
  <div class="glow"></div>

  <header>
    <span class="mark"><i></i><i></i><i></i></span>
    西浩资源库
    <span class="tag">开源软件 · AI 工具 · 中文教程</span>
  </header>

  <main>
    <p class="eyebrow">GitHub 开源资源 · 每条都核实过</p>
    <h1>把 GitHub 上值得用的东西，<br>做成你<em>直接能拿到手</em>的中文资源。</h1>
    <p>开源软件、AI 工具与中文教程的整理索引：附官方仓库、协议说明与百度网盘获取方式，提取码一键复制。</p>
  </main>

  <footer>
    <span class="host">www.xihaouc.top</span>
    <span class="facts">
      <span class="fact">逐条核实</span>
      <span class="fact">不编造</span>
      <span class="fact">网盘直取</span>
      <span class="fact">无广告</span>
    </span>
  </footer>
</body>
</html>
