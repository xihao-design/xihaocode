<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    width:1200px;height:630px;overflow:hidden;
    background:#FAF9F5;color:#1A1915;
    font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB","Segoe UI",sans-serif;
    display:flex;flex-direction:column;justify-content:space-between;
    padding:76px 80px;
    position:relative;
  }
  /* 右侧极淡的分类色块，暗示产品内容而非装饰 */
  .tiles{position:absolute;right:-40px;top:50%;transform:translateY(-50%);
    display:grid;grid-template-columns:repeat(3,74px);gap:14px;opacity:.5}
  .tiles i{width:74px;height:74px;border-radius:18px}
  .tiles i:nth-child(1){background:#F6E9E3}
  .tiles i:nth-child(2){background:#F1E9EE}
  .tiles i:nth-child(3){background:#E8EDF1}
  .tiles i:nth-child(4){background:#E9EFE8}
  .tiles i:nth-child(5){background:#F5EDE1}
  .tiles i:nth-child(6){background:#EFEEE3}
  .tiles i:nth-child(7){background:#F7E9E2}
  .tiles i:nth-child(8){background:#F0EEE6}
  .tiles i:nth-child(9){background:#F6E9E3}

  header{display:flex;align-items:center;gap:11px;font-weight:650;font-size:22px;letter-spacing:-.01em;position:relative}
  .dot{width:12px;height:12px;border-radius:4px;background:#D97757}

  main{position:relative;max-width:730px}
  .eyebrow{font-size:14px;letter-spacing:.16em;text-transform:uppercase;color:#8B887C;margin-bottom:20px}
  h1{font-size:60px;line-height:1.16;letter-spacing:-.028em;font-weight:650}
  h1 em{font-style:normal;color:#D97757}
  p{margin-top:22px;font-size:20px;line-height:1.7;color:#55534B;max-width:640px}

  footer{display:flex;align-items:flex-end;justify-content:space-between;position:relative}
  .host{font-size:17px;color:#8B887C;letter-spacing:.02em}
  .count{font-size:17px;color:#55534B}
  .count b{color:#1A1915;font-weight:650}
</style>
</head>
<body>
  <div class="tiles"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>

  <header><span class="dot"></span>XihaoUC</header>

  <main>
    <p class="eyebrow">GitHub 开源软件合集</p>
    <h1>把好用的开源软件，<br>从 GitHub 带到<em>你的手机</em>。</h1>
    <p>覆盖影音播放、动漫阅读、系统工具、图片处理、效率笔记与生活健康。</p>
  </main>

  <footer>
    <span class="host">www.xihaouc.top</span>
    <span class="count"><b>37</b> 款免费开源软件 · <b>6</b> 个分类 · 无广告</span>
  </footer>
</body>
</html>
